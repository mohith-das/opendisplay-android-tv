name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mohith-das/opendisplay-android-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opendisplay-tv-release.p12"
          chmod 600 "$RUNNER_TEMP/opendisplay-tv-release.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/opendisplay-tv-release.p12"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Test, lint, and build signed release
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OpenDisplay-TV.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs dist/OpenDisplay-TV.apk
          (cd dist && sha256sum OpenDisplay-TV.apk > OpenDisplay-TV.apk.sha256)
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/OpenDisplay-TV.apk dist/OpenDisplay-TV.apk.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --latest --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" dist/OpenDisplay-TV.apk dist/OpenDisplay-TV.apk.sha256 \
              --verify-tag --latest --title "OpenDisplay TV $GITHUB_REF_NAME" \
              --notes "Unofficial community Android TV receiver release. See CHANGELOG.md and README.md for features, installation, security, and known limitations."
          fi

